<style>
.snowy-brand { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
.snowy-mark { width:64px; height:80px; object-fit:contain; }
.snowy-wordmark { font:700 13px system-ui; letter-spacing:.14em; color:#176657; }
.snowy-subtitle { font:400 12px system-ui; color:#485e61; margin-top:4px; }
@media (min-width: 641px) {
  .st-key-observation-details { margin-top:-12px; }
}
[class*="st-key-report-result-"] {
  animation: snowy-result-enter 420ms ease-out both;
}
@keyframes snowy-result-enter {
  from { opacity:0; transform:translateY(12px); }
  to { opacity:1; transform:translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  [class*="st-key-report-result-"] { animation:none; }
}
</style>
<div class="snowy-brand" aria-label="Snowy Roads, winter condition review">
  <img class="snowy-mark" src="{{LOGO_URI}}" alt="Snowy Roads logo">
  <div><div class="snowy-wordmark">SNOWY ROADS</div><div class="snowy-subtitle">Winter condition review</div></div>
</div>
